# Local overlay for planning_simulator / Jetson CPU latency.
# Universe default is 1.0s (autoware_scenario_selector/config/scenario_selector.param.yaml).
# On this machine LaneDriving trajectory age is typically 3.3–4.2s, so 3.0 is still too tight.
# ros2 param set is NOT sufficient: the node copies th_max_message_delay_sec at construction
# and has no parameter callback.
#
# This is a latency accommodation, not a planning-performance fix.
/**:
  ros__parameters:
    update_rate: 10.0
    th_max_message_delay_sec: 5.0
    th_arrived_distance_m: 1.0
    th_stopped_time_sec: 1.0
    th_stopped_velocity_mps: 0.01
    enable_mode_switching: true
    # Must match mission_planner allow_area when using lanelet-area-lanelet routes
    allow_area: false
